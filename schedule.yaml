- title: VisArch
  date: Sunday, March 22
  contents:
  - title: AI x Hardware for Wearable Contextual AI Systems
    description: The next generation of human-oriented computing will require always-on, spatially-aware wearable devices to capture egocentric vision and functional primitives (e.g., Where am I? What am I looking at?, etc.). These devices will sense an egocentric view of the world around us to observe all human-relevant signals across space and time to construct and maintain a user's personal context. This personal context, combined with advanced generative AI, will unlock a powerful new generation of contextual AI personal assistants and applications. However, designing and building a wearable system to support contextual AI is a daunting task because of the system's stringent power constraints due to weight and battery restrictions, as well as highly complex hardware architecture. To understand how to guide design for such systems, we construct and present the first complete system architecture view of one such wearable contextual AI system (Aria2). We will then look at the technical depth and breadth collectively required to build and implement such a system and highlight some key opportunities for AI-assisted hardware design. By harnessing advancements in AI for hardware, we expect to develop powerful new capabilities to help bridge the semantic gap and automate technical expertise to accelerate the implementation of future wearable systems.
    time: TBA
    leads:
    - Vincent T. Lee, Research Scientist at Reality Labs Silicon Research at Meta

  - title: The Future of Extended Reality is Adaptive
    description: New advanced interactive technologies such as Extended Reality (XR) have the potential to transform the way we interact with digital information, and promise a rich set of applications, ranging from productivity and architecture to interaction with smart devices. Current approaches to interactive XR systems, however, are static, and users need to manually adjust factors such as the visibility, placement and appearance of their user interface every time they change their task or environment. This is distracting and leads to information overload. To overcome these challenges, we aim to understand and predict how users perceive and interact with digital information, and use this information in context-aware systems that automatically adapt when, where and how to present virtual elements. In this talk, I will present computational and multimodal approaches that leverage contextual knowledge about users, the environment and system capabilities to create advanced interactive experiences. Our systems increase the applicability of XR and advanced interactive systems, with the goal to seamlessly blend the virtual and physical world.
    time: TBA
    leads:
    - David Lindlbauer, Assistant Professor at the Human-Computer Interaction Institute at Carnegie Mellon University

